name: Android APK release

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

env:
  APK_ASSET_NAME: tableau-de-bord-sante.apk
  JAVA_VERSION: "21"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ANDROID_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/${{ env.APK_ASSET_NAME }}
        run: npm run build

      - name: Add Capacitor Android platform
        working-directory: frontend
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release asset
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "${{ env.APK_ASSET_NAME }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_ASSET_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('app-v{0}', github.run_number) }}
          name: Application Android ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.APK_ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
